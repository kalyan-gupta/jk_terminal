name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select target environment/branch to build'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - integration
          - master
      commit_id:
        description: 'Optional: Specific commit ID to build from'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_id }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Determine tag based on the manual user input
      - name: Determine Target Tag
        id: vars
        run: |
          if [ "${{ github.event.inputs.environment }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.environment }}" = "integration" ]; then
            echo "tag=int" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            lingamkalyangupta/jk_terminal:${{ steps.vars.outputs.tag }}
            lingamkalyangupta/jk_terminal:${{ steps.vars.outputs.tag }}-${{ steps.vars.outputs.sha }}